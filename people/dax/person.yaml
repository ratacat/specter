workflow: |
  "We try not to have too many opinions in how agents should work. Every model is intensely trained to use certain tools and workflows so we try to match that environment perfectly. You can think you came up with something better but it will just underperform."
  Repo spec is two layers: AGENTS.md (style, commits, session-v2 invariants) + CONTEXT.md (named domain language: System Context vs Session History vs Context Epoch — with forbidden synonyms). UI/core features need design review before implementation. `/learn` writes non-obvious session learnings into the nearest AGENTS.md (1–3 lines).
