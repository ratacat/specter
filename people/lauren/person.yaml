  2026-08: Grok @Bot / Cursor @ SpaceXAI. Entry point is /setup-pstack then /poteto-mode. Coordinator can be a big model; coding workhorses Auto/Grok. Cloud swarm skill for parallel slices.
  Does not default to planning: "the best spec is code." Cursor plan mode is optional. Feature playbook: /how the subsystem → /architect (or skip with a reason) → named data shape → delegate impl to a subagent → verify on the real surface (not "it compiles") → small stacked commits. Parallelism only after you can trust one agent.
