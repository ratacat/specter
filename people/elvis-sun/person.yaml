  2026-08: 7-day solo-founder sprint. Fri plan/scope; sat/sun 4–5 parallel /goal on Claude Code + Codex for the heavy 80%; Mon calls + quick wins (Claude reset); Tue close last 20%; Wed soak; Thu launch. Agents do support/bugs/ops all week.
  Product quality = a practitioner eval, not a vibe. Advisor @prcarly grades media lists weekly (anti-overfit: cannot edit her emails). Score 27.9 → 51.3. Encode her method as subagents: one news → several *angles*, chat the plan, then one research subagent per angle in its own container, each picking the next query from what it just read.
  newsjack AGENTS.md: CLI is deterministic JSON; judgment/angles live in skills. Evidence-first discovery, strict surfacing. Minimal durable memory.
