workflow: |
  Agency ships one-off design tools instead of living in Figma/AE. `npx @pixel-point/toolcraft create` copies the runtime into the app so the agent can rewrite anything. Preflight: read workflow.md, then brainstorm spec → writing-plans → implement. Figma MCP is source of truth (not screenshots). Video refs get a frame-by-frame study first.
  2026-08: "not one-shotted" — a day of iterations to lock math, refs, on-brand vibe. Grok 4.6 for speed/cheap; Fable still best at design requests. Harness overhaul to cut tokens and skip needless perf testing on later runs.
  Plans are dated, product-decision lists + exact files + a verification *tier* (0–4). Worklog is a gate (`npm run test` fails if the decision trail is missing).
