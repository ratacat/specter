workflow: |
  Lazar: kernel is a small Rust runner (one tool `bash`, sandboxed). Skills/memory on disk are the agent's being; kernel source is chmod a-w and the binary is chflags-locked. Kernel edits go through a proposal ceremony, not agent write.
  Plans are numbered files from an improve/review pass (`plans/001-….md`) plus a README status table. Each plan: drift check against a pinned commit, Why, Current state excerpts, Scope in/out, Git workflow, Steps with per-step verify, Done criteria, STOP conditions, Maintenance notes. Rejected findings listed so nobody re-audits them. Executors are worktree-isolated subagents; operator merges.
  Agensis (2026-08): identity/memory persist across threads. Language is Direct (web→API), Relay (desktop/CLI), Connector (MCP/webhook). Desktop can be a relay so agents keep running. Agent Farm harvests skills and manages Claude account rotas/worktrees.
