workflow: |
  Feature pipeline is four artifacts, not Plan mode. /research first (parallel agents: codebase, docs, web, deps, UI/UX) because Plan mode misses recent docs. Then /build:
  1. research → docs/{name}/RESEARCH.md
  2. implementation → docs/{name}/IMPLEMENTATION.md (phased; each phase ships something testable)
  3. progress → docs/{name}/PROGRESS.md
  4. /build phase N executes; /build status names the next step
  Live instance: nurb `docs/evals/{RESEARCH,IMPLEMENTATION,PROGRESS}.md`. Phases have Objective / Rationale / Tasks / Success Criteria / Files Likely Affected. PROGRESS records a fresh-context verifier, evidence commands, decisions, and an adversarial pass that found real cheats. "One task done exhaustively fair beats three done shallowly."
  After code: /but-for-real (git diff, prove it, no victory lap). Before commit: /learnings (high bar; "nothing worth adding" is valid).
  2026-08: building nurb eval leaderboard (Claude/Codex/Gemini) on contributor subscriptions, not API keys.
