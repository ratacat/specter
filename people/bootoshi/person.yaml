workflow: |
  Spec language is two layers: Goal / Success means / Stop when, then every sentence a positive verb. Negations are a smell. That is how he writes AGENTS.md, skills, and agent directives.
  Before planning: intent-contract → human-signed Locked Intent Boundary (required deltas, invariants, authorized-change rows) → hash-pinned IntentLock. Then rgr: freeze the failing test (SHA-256), green cannot edit it, verify --ci --replay in CI. ".rgr/ is evidence, not authority."
  2026-08: walks + one giant voice prompt; used to survive Fable+CC, now compaction steers him off. Trying OMP because it summarizes a file before the agent reads it. Harnesses = "LLM state machine vessels." Native CLI (CC/Codex) + plug-in products, not products that steal the agent surface.
  Claude orchestrates; Codex in tmux does the mechanical work. Cartographer first on unknown repos.
