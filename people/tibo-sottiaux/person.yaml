workflow: |
  "Scaffolding is coping not scaling." The harness is temporary: remove it as the model gets better, or you get capability overhang (the wrapper limits the model). Build the agent first; discover scalable primitives; let the model do the work. Cache-hit rate is a first-class efficiency metric for long sessions.
  2026-08: 20M Codex actives; public ops on rate limits, image+compaction waste, conversation-title drain. Official clients + OSS that Sign in with ChatGPT (Pi, OpenCode) are the supported surface.
  Public GitHub under this login is not the Codex source of truth (slop-looking stubs). Spec lives in interviews + product.
