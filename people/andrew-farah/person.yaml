workflow: |
  Context is local files, not chat. `ft sync` pulls X bookmarks to disk so any agent with a shell can search them. Specs for new work come out of `ft possible`: a seed (real bookmarks, never invented text) + repos + a 2x2 frame (e.g. leverage × specificity) → survey → generate → critique → score. Each surviving idea is a node with axis justifications, effort, and a copiable goal prompt pasted into Claude Code / Codex.
  Artifacts are dated markdown under `~/.fieldtheory/ideas/{seeds,runs,nodes,batches}/` with YAML cross-links. Nightly/background runs are first-class. `/chapter` writes long-form Library pages from the same context (Kindle export).
  CLI is MIT; Mac app is the viewer. Agents drive `ft`, not the GUI.
