workflow: |
  Spec of a project is VISION.md: an acceptance policy, not a roadmap. /vision mines merged PRs (evidence over vibes), drafts 40–70 lines, then stress-tests on a lavish-axi board of 8–12 non-obvious hypotheticals. Author owns every line. "A change aligns when … / A change should be resisted when …"
  Operating model (Grok Ship, 2026-08-20): captain talks only to Firstmate. Firstmate writes a sqlite task row (kind scout|ship|decision), delegates to a charter'd crewmate. Scout = report, never a PR. Ship = Cursor cloud agent + fresh-context adversarial review; no PR until review is clean; no merge without captain word. Decisions come one card at a time. Complex planning is a lavish HTML session, not a markdown book. Chat is not the backlog.
  Scripts own mechanics; agents own judgment. The first mate does not do the work.
