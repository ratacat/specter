workflow: |
  2026-08-24: "2025 caffeinate flows are dead. Year of the background agent." Spec is a prompt + environment (repos, secrets, skills); execution is a cloud session you check later. Parallel sessions, fire-and-forget PRs, Linear/Slack/GitHub as the inbox.
  Architecture: control plane (Cloudflare Workers, Durable Objects, D1) vs data plane (sandboxes). Secrets stay out of the sandbox (placeholder env + egress proxy allowlist). Managed Skills centralize org skills off laptops/repos.
  Decisions as short ADRs (single-provider SCM, session contracts). Docs are current-state how-it-works, not a 50-chapter product plan.
