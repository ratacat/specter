# Spec components — Specter domain language.
# One concept, one term. synonyms are scrape aliases, not extra concepts.
# description: what the part is.
# instructions: how to write it. Included in specfinition.
#
# Corpus-only (appear in others' plans; not house terms):
#   file map, executor commands, task, phase, stop, intent

- term: front matter
  synonyms:
    - Frontmatter
    - YAML front matter
    - metadata
  description: >
    Document fields, not a body section: title, date, status
    (draft | agreed | superseded), slug, parent. Status and
    parent live here, not as their own components.
  instructions: >
    Fill title, date, status, slug. Set parent only when this
    spec iterates an earlier one. Do not add extra fields.

- term: problem
  synonyms:
    - Problem Statement
    - Why this matters
  description: >
    Pain today, from the user's side. Who cannot do what.
    Not the as-is topology — that is current system.
  instructions: >
    Always include. Name who hurts and what they cannot do
    today. Stay in the user's world, not the code. If several
    pains exist, mark which this spec addresses.

- term: current system
  synonyms:
    - Current state
    - Current State Analysis
    - Key Codebase Facts
  description: >
    How it actually works now. Snapshot, not a wish.
  instructions: >
    If blank, it is not used (greenfield). When present, snapshot
    what exists now. Do not write wishes here.

- term: solution
  synonyms:
    - Recommended Approach
  description: >
    What becomes true for that user when this spec is done.
    Same altitude as problem. Not architecture.
  instructions: >
    Always include. Same altitude as problem. One or two
    paragraphs of the new outcome. Do not preview architecture,
    data models, or work units here.

- term: user stories
  synonyms:
    - User story
    - User Stories
  description: >
    Actor, observable capability, benefit. Tag with a work-unit
    id when this spec delivers it. Untagged is context, not work.
  instructions: >
    Write enough to cover edges. Tag a story with a work-unit
    id when this spec delivers it. Untagged is context, not work.

- term: success
  synonyms:
    - Success Criteria
    - Done criteria
    - Quality Gates
    - Verification
    - Test plan
  description: >
    Checkable facts that the work is done. A stranger can tell
    pass from fail on a real surface (screen, CLI, eval, the
    command that proves it). Inconclusive is fail.
  instructions: >
    Always include. Each line is a checkable fact on a real
    surface. Inconclusive is fail. Do not list chores.

- term: out of scope
  synonyms:
    - What we're NOT doing
    - Non-goals
  description: >
    Named no's for this spec. Not later work — later work is
    still wanted.
  instructions: >
    Named no's for this spec. Do not put later work here.

- term: later work
  synonyms:
    - Next
    - Next steps
    - Further work
    - Post-Implementation
    - MVP vs next
  description: >
    Wanted, not this spec. Do not build it. Let the possibility
    inform current design so this work does not paint that
    future shut.
  instructions: >
    Wanted, not this spec. Do not build it. Let it shape the
    current design so this work does not paint that future shut.

- term: edit whitelist
  synonyms:
    - Can edit
    - Can / cannot edit
  description: >
    Domain surfaces this spec may change. Blast radius you
    accept, by domain, never by path.
  instructions: >
    If blank, it is not used. Do not read empty as "edit
    nothing." When present, only these domain surfaces may
    change. Name by domain, never by path.

- term: edit blacklist
  synonyms:
    - Cannot edit
  description: >
    Domain surfaces this spec must not change. Read-only for
    this work even if a "better" fix lives there.
  instructions: >
    If blank, it is not used. Do not read empty as "edit
    everything" or "edit nothing." When present, those domain
    surfaces are read-only for this spec even if a better fix
    lives there.

- term: invariants
  synonyms:
    - Invariant
    - Non-negotiables
    - Constraints
  description: >
    True before, during, and after. A goal can complete; an
    invariant can only be upheld. Keep the list short.
  instructions: >
    Keep the list short. A goal can complete; an invariant can
    only be upheld. Reserve NEVER/MUST for these lines.

- term: design decisions
  synonyms:
    - Decision
    - Decisions
    - Implementation Decisions
    - Product decisions
    - Rationale
  description: >
    Contested calls, and why not the obvious alternative.
    Skip anything already obvious from problem or solution.
  instructions: >
    Record a row only when a reader would ask why this, not the
    other thing. Skip anything already obvious from problem or
    solution.

- term: open questions
  synonyms:
    - Open question
    - Open decisions
    - Open Questions
  description: >
    Deliberately unsettled. Write the options already visible.
    If the work cannot ship without an answer, it is not open.
  instructions: >
    Write the options already visible. If the work cannot ship
    without an answer, it is not open.

- term: call contract
  synonyms:
    - Command surface
    - Command / API surface
    - Commands
    - Named surface
  description: >
    The design at the edge: named things a user or program
    actually invokes (CLI verbs, routes, RPC, flags, events)
    and what must never appear in output. Not shell the
    implementer runs.
  instructions: >
    Show named verbs a caller runs and what must never appear
    in output. If there is no user-facing surface, say so and
    point success at the remaining observable.

- term: data models
  synonyms:
    - Data model
    - Schema
    - Schema & API contract
  description: >
    Durable shapes and meaning. YAML or JSON of the data, not
    of source files. Not ORMs, not tables-as-files.
  instructions: >
    Show YAML or JSON of the data, not of source files. Name
    entities in domain language. Show one happy record and the
    empty cases success cares about.

- term: architecture
  synonyms:
    - Architecture Overview
    - Architecture (modules)
  description: >
    Modules, interfaces, seams, edges. Map of duties. Not a
    file tree.
  instructions: >
    Map modules, interfaces, seams, edges. If no new module and
    no changed edge, one line naming where behaviour lands. Not
    a file tree.

- term: domain language
  synonyms:
    - Vocabulary
    - Glossary
    - Terms
  description: >
    Product terms this document must use. Infer the language
    already in the product and domain; do not invent
    alternatives. After agreement, no synonym drift.
  instructions: >
    Infer product terms already in use; do not invent stand-ins.
    Agree with the user before status: agreed. After that, no
    synonym drift. Always include.

- term: automation metric
  synonyms:
    - Metric
    - Optimization metric
    - Cost model
  description: >
    One number the agent may move. Keep vs discard.
  instructions: >
    For auto-research loops (keep vs discard a trial), not
    ordinary product work. If blank, it is not used. When
    present, one number, directional, measured the same way
    every run. Write with automation budget, or neither. Do
    not invent a vanity score.

- term: automation budget
  synonyms:
    - Budget
  description: >
    Cap that ends a trial (wall-clock, tokens, runs). The
    metric decides keep/discard; the budget decides when a
    trial is over.
  instructions: >
    For auto-research loops. If blank, it is not used. When
    present, the cap that ends a trial (wall-clock, tokens,
    runs). Write with automation metric, or neither.

- term: risks
  synonyms:
    - Risk
    - Risks and Challenges
    - Risks & mitigations
  description: >
    What might go wrong in this change. Not halt rules for
    the executor.
  instructions: >
    What might go wrong in this change. Not halt rules for
    the executor.

- term: work units
  synonyms:
    - work unit
    - Unit
    - U-ID
    - atomic unit
    - behavior
  description: >
    Named behaviors this spec is on the hook to deliver.
    Stable ids (U1, U2, …). Never renumber. Split keeps the
    original id; new work takes the next unused number.
  instructions: >
    Always include. Stable ids (U1, U2, …). Never renumber.
    Split keeps the original id; new work takes the next
    unused number.
